<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎂 Lista de compras — Aniversário da Raquel</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#33253a;background:#fff8fb}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:760px;margin:auto}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:0 0 8px}p{color:#746779}.panel{background:white;border:1px solid #f3dce8;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #9c55700b}h2{font-size:1.25rem;margin:0 0 14px;color:#a73c71}.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f7eef3;cursor:pointer}.item:last-child{border-bottom:0}input[type=checkbox]{accent-color:#bc4f85;width:20px;height:20px;flex:none}.item:has(input:checked) span{text-decoration:line-through;color:#9e929b}.bar{height:12px;background:#f2dce7;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#bd4f85;transition:width .2s}.status{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-weight:600}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;background:#ad4079;color:white;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#f3e4ec;color:#783657}.note{background:#fff1d7;border-color:#f6dba8}.note h2{color:#8e5b12}.small{font-size:.9rem}footer{text-align:center;font-size:.85rem;color:#887b85;margin:24px 0}@media print{body{background:white;padding:0}.panel{box-shadow:none;break-inside:avoid}.actions{display:none}}
</style>
</head><body><main class="wrap"><header><h1>🎂 Aniversário da Raquel</h1><p>Lista de compras • Marque os itens conforme comprar</p></header><section class="panel"><div class="status"><span>Progresso das compras</span><span id="counter">0/0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="actions"><button id="copy">📋 Copiar lista</button><button class="secondary" onclick="window.print()">🖨️ Imprimir</button><button class="secondary" id="reset">↺ Desmarcar tudo</button></div></section><div id="sections"></div><section class="panel note"><h2>👜 Vou levar de casa</h2><div id="own"></div><p class="small">O requeijão e o leite zero lactose são separados dos itens da lista de compras.</p></section><footer>As marcações ficam salvas neste navegador.</footer></main><script>
const groups=[['🥖 Café da manhã',['12 cacetinhos','1 requeijão','8 fatias de queijo (para os demais)','20 ovos','1 litro de leite','1 pacote de café para passar','1 cacho de bananas']],['🍗 Almoço',['2 pacotes de coxa e sobrecoxa (4 unidades cada; 8 no total)','1 kg de arroz','1 saco de carvão','1 pacote de sal','2 tomates grandes']],['🌭 Cachorro-quente',['8 pães grandes de cachorro-quente','12 salsichas','1 pacote de batata palha','2 pacotes de queijo ralado','1 ketchup','1 maionese','1 mostarda','1 lata de seleta de milho e ervilha']],['🍡 Doces e petiscos',['1 pacote de marshmallow','1 pacote de biscoito Bauducco']]];
const own=['Meu requeijão zero lactose','Meu leite zero lactose'];const key='raquel-aniversario-checklist-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
const sections=document.getElementById('sections');function makeItem(name,prefix){const label=document.createElement('label');label.className='item';const cb=document.createElement('input');cb.type='checkbox';const id=prefix+name;cb.checked=!!saved[id];cb.addEventListener('change',()=>{saved[id]=cb.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}update()});const span=document.createElement('span');span.textContent=name;label.append(cb,span);return label}
groups.forEach(([title,items],i)=>{const section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.textContent=title;section.append(h);items.forEach(item=>section.append(makeItem(item,'buy:')));sections.append(section)});own.forEach(item=>document.getElementById('own').append(makeItem(item,'own:')));
function update(){const boxes=[...sections.querySelectorAll('input')];const done=boxes.filter(x=>x.checked).length;document.getElementById('counter').textContent=`${done}/${boxes.length}`;document.getElementById('fill').style.width=`${done/boxes.length*100}%`;}update();
document.getElementById('reset').onclick=()=>{if(confirm('Desmarcar todos os itens, inclusive os que você vai levar?')){saved={};document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);try{localStorage.removeItem(key)}catch{}update()}};
document.getElementById('copy').onclick=async()=>{const lines=groups.map(([title,items])=>title+'\n'+items.map(x=>(saved['buy:'+x]?'☑ ':'☐ ')+x).join('\n'));lines.push('👜 Vou levar de casa\n'+own.map(x=>(saved['own:'+x]?'☑ ':'☐ ')+x).join('\n'));const text=lines.join('\n\n');try{await navigator.clipboard.writeText(text);alert('Lista copiada!')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();alert('Lista copiada!')}};
</script></body></html>
